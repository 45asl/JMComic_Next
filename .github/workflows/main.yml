name: Build JMComic_Next APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle缓存
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('JMComic_Next/**/*.gradle*', 'JMComic_Next/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 更新Gradle Wrapper到9.6.8
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.8-bin.zip|g' JMComic_Next/gradle/wrapper/gradle-wrapper.properties

      - name: 赋予gradlew执行权限
        run: chmod +x JMComic_Next/gradlew

      - name: 编译Debug APK
        run: cd JMComic_Next && ./gradlew assembleDebug

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-debug-apk
          path: JMComic_Next/app/build/outputs/apk/debug/app-debug.apk
