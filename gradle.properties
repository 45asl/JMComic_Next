#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Sat Feb 28 16:37:08 GMT 2026
android.nonTransitiveRClass=true
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
android.useAndroidX=true

# --- Termux / aarch64 local build tuning ---
# AGP would otherwise pull the linux-x86_64 aapt2 from Maven, which cannot run
# on aarch64. Point it at the arm64 binary from the local build-tools instead.
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-sdk/build-tools/35.0.1/aapt2
# Keep the heaps modest: this device has ~3 GB free RAM (plus swap).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false

# 关闭 AGP 的「资源优化」步骤（OptimizeResourcesTask）。
#
# 这不是保守设置，而是必需的规避：在本环境（aarch64 + aapt2FromMavenOverride 指向
# arm64 版 aapt2）下，该步骤会产出**空的资源表** —— release 包最终 111 个条目，
# 既没有 AndroidManifest.xml 也没有 resources.arsc，apksigner 报
# 「Missing AndroidManifest.xml」，pm install 直接失败。
# debug 变体不走这个步骤，所以一直正常，问题只在发布包里出现。
#
# 实测：关掉后 release 包立即恢复为 1039 个条目并含 manifest 与 resources.arsc。
# 代价是不再做资源的无用条目裁剪，体积会略大 —— 这是可以接受的，
# 换来的是一个能装得上的发布包。
android.enableResourceOptimizations=false
